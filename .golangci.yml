version: "2"

linters:
  enable:
    - errname
    - errorlint
    - gocritic
    - godoclint
    - godot
    - gosec
    - misspell
    - nilerr
    - nilnesserr
    - revive
    - unconvert
    - unparam
  settings:
    revive:
      rules:
        - name: exported
          disabled: false
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - gosec
          - errcheck
          - godoclint
          - godot
          - gocritic
          - unparam
